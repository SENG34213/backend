server:
  port: 8084

spring:
  application:
    name: tournament-service
  datasource:
    url: ${TOURNAMENT_DB_URL}
    username: ${TOURNAMENT_DB_USER}
    password: ${TOURNAMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 9000000   # 15 minutes, per ADR-07

# Base URL for inter-service HTTP calls (override via env var for Docker/cloud)
services:
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
