server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
