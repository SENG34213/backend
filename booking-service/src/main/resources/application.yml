server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 9000000   # 15 minutes, per ADR-07

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

# Base URL for inter-service HTTP calls (override via env var for Docker/cloud)
services:
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}


loyalty:
  base-url: ${LOYALTY_BASE_URL:http://localhost:8085}
