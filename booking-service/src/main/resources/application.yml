server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
  jackson:
    time-zone: Asia/Colombo
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Colombo
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 9000000   # 15 minutes, per ADR-07

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

services:
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  socket-server:
    base-url: ${SOCKET_SERVER_URL:http://localhost:5001}

loyalty:
  base-url: ${LOYALTY_BASE_URL:http://localhost:8085}

resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      loyaltyService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

