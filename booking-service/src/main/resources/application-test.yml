# Activated in CI via SPRING_PROFILES_ACTIVE=test (see backend/.github/workflows/ci.yml).
# Points integration tests at the CI's disposable Postgres container instead
# of the dev database — see CI-2 in the foundation development plan.
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:booking_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:sa}
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:test-gateway-secret}

loyalty:
  base-url: ${LOYALTY_SERVICE_URL:http://localhost:8085}
  connect-timeout-ms: 2000
  read-timeout-ms: 3000

eureka:
  client:
    enabled: false   # integration tests don't need service discovery running
