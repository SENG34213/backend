server:
  port: 8085

spring:
  application:
    name: loyalty-service
  datasource:
    url: jdbc:postgresql://localhost:5433/gamingcastle_loyality
    username: gc_admin
    password: gc_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
