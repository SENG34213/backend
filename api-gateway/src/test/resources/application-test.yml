# Test configuration for api-gateway
# Active during automated tests (@ActiveProfiles("test"))

server:
  port: 0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: http://localhost:${wiremock.server.port:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/auth/password/**
        - id: booking-service
          uri: http://localhost:${wiremock.server.port:8082}
          predicates:
            - Path=/api/bookings/**,/api/stations/**,/api/bookings/admin/**,/api/games/**,/api/admin/games/**
        - id: payment-service
          uri: http://localhost:${wiremock.server.port:8083}
          predicates:
            - Path=/api/payments/**
        - id: tournament-service
          uri: http://localhost:${wiremock.server.port:8084}
          predicates:
            - Path=/api/tournaments/**,/api/tournaments
        - id: loyalty-service
          uri: http://localhost:${wiremock.server.port:8085}
          predicates:
            - Path=/api/loyalty/**

eureka:
  client:
    enabled: false

jwt:
  secret: test-jwt-secret-key-that-is-at-least-32-bytes-long!

gateway:
  internal-secret: test-gateway-internal-secret
