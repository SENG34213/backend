server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/auth/password/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**,/api/bookings,/api/stations/**,/api/stations,/api/bookings/admin/**,/api/bookings/admin,/api/games/**,/api/games,/api/admin/games/**,/api/admin/games,/api/reviews/**,/api/reviews
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: tournament-service
          uri: lb://tournament-service
          predicates:
            - Path=/api/tournaments/**
        - id: loyalty-service
          uri: lb://loyalty-service
          predicates:
            - Path=/api/loyalty/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}
  ratelimit:
    auth:
      replenish-rate: 5
      burst-capacity: 10

