server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/gamingcastle_users
    username: gc_admin
    password: gc_password
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, not Hibernate — see db/migration
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # FR-04: SMTP delivery for password-reset emails. Leave username/password
  # blank for local dev — SmtpEmailServiceImpl will only fail at send time,
  # not at startup. See READMELocal.md for provider setup (Gmail App Password,
  # Brevo, SendGrid, Mailtrap...).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:jashva25@gmail.com}
    password: ${MAIL_PASSWORD:cpruzdasbciwblug}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 50000
          timeout: 50000
          writetimeout: 50000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:gaming-castle-dev-secret-change-me-in-production-min-256-bits}
  expiration-ms: 900000   # 15 minutes, per ADR-07

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:gaming-castle-dev-gateway-secret-change-me}

app:
  mail:
    from: ${MAIL_FROM:jashva25@gmail.com}

# FR-05: Twilio delivery for password-reset SMS. default-country-code is used
# to turn a locally-formatted number (e.g. 0771234567) into E.164 (+94771234567)
# before it's sent to Twilio.
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  default-country-code: ${TWILIO_DEFAULT_COUNTRY_CODE:+94}
