server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/gamingcastle_user}
    username: ${USER_DB_USER}
    password: ${USER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, not Hibernate — see db/migration
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # FR-04: SMTP delivery for password-reset emails. Leave username/password
  # blank for local dev — SmtpEmailServiceImpl will only fail at send time,
  # not at startup. See READMELocal.md for provider setup (Gmail App Password,
  # Brevo, SendGrid, Mailtrap...).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 50000
          timeout: 50000
          writetimeout: 50000


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 9000000   # 15 minutes, per ADR-07

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

app:
  mail:
    from: ${MAIL_FROM:}

