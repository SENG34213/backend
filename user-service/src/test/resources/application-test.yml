# Test environment configuration for user-service
# Active during automated tests (@ActiveProfiles("test") or SPRING_PROFILES_ACTIVE=test)

spring:
  application:
    name: user-service
  datasource:
    # Dedicated test database — never point to the dev/prod database
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamingcastle_test}
    username: ${DB_USER:test}
    password: ${DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Colombo
    show-sql: false
  jackson:
    time-zone: Asia/Colombo
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

# Deterministic test-only JWT configuration (256-bit secret for HMAC-SHA256)
jwt:
  secret: test-jwt-secret-key-that-is-at-least-32-bytes-long!
  expiration-ms: 900000

# Deterministic test-only Gateway secret configuration
gateway:
  internal-secret: test-gateway-internal-secret

# Test-only service endpoints
services:
  notification:
    base-url: http://localhost:8086
