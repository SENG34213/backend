name: Backend CI Pipeline

on:
  push:
    branches: [develop, main, 'feature/**', 'fix/**']
  pull_request:
    branches: [develop, main]

jobs:
  # Eureka and the Gateway don't touch the database, so they're built
  # separately from the matrix below — no Postgres service container needed.
  eureka-build:
    name: Eureka Server – Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - working-directory: eureka-server
        run: mvn -B clean verify

  gateway-build:
    name: API Gateway – Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - working-directory: api-gateway
        run: mvn -B clean verify

  # One job, run once per service in the matrix, instead of 5 near-identical
  # job blocks — a broken build in ANY service fails independently and is
  # reported by name (e.g. "domain-services (payment-service)").
  domain-services:
    name: ${{ matrix.service }} – Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - booking-service
          - payment-service
          - tournament-service
          - loyalty-service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gamingcastle_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B clean verify
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/gamingcastle_test
          DB_USER: test
          DB_PASSWORD: test

      - name: Upload coverage report (${{ matrix.service }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - booking-service
          - payment-service
          - tournament-service
          - loyalty-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check for high/critical vulnerabilities
        working-directory: ${{ matrix.service }}
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8
        continue-on-error: true  # informational until the plugin is tuned; remove once stable
